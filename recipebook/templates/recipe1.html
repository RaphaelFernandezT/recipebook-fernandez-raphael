{% extends 'ledger/base.html' %}

{% block content %}
<h1>Recipe Book</h1>
    <h2> {{name}} </h2>
    <ul>
        <h3> ingredients: </h3>
        {% for ingredient in ingredients %}
            <ul>
                <li> {{ingredient.quantity}} {{ingredient.name}} </li>
            </ul>
        {% endfor %}
        <h4> </h4>
        <form action={{link}}>
            <input type="submit" value="View Recipe List">
        </form>
    </ul>
{% endblock %}
