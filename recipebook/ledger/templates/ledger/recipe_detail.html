{% extends 'ledger/base.html' %}

{% block content %}
<h1>Recipe Book</h1>
<h2>{{ recipe.name }}</h2>

<h3>Ingredients:</h3>
<ul>    
    {% for recipe_ingredients in recipe.ingredients.all %}
        <li>
            {{ recipe_ingredients.quantity }} {{ recipe_ingredients.ingredient.name }} 
        </li>
    {% endfor %}
    <a href="{% url 'ledger:recipe_list' %}">Back to Recipe List</a>
</ul>

{% endblock %}
