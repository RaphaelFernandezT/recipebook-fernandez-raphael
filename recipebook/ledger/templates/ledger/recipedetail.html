{% extends 'ledger/base.html' %}

{% block content %}
<h1>Recipe Book</h1>
<h2>{{ recipes.name }}</h2>

<h3>Ingredients:</h3>
<ul>
    {% for recipe in recipes.ingredients.all %}
        <li>
            {{ recipe.quantity }} {{ recipe.ingredient.name }} 
        </li>
    {% endfor %}
    <form action="{% url 'ledger:recipelist'  %}" method="get">
        <input type="submit" value="Back to list">
    </form>
</ul>

{% endblock %}
