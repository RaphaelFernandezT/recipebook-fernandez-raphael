{% extends 'ledger/base.html' %}

{% block content %}
<ul>
    <h1>Recipes</h1>
    {% for recipe in recipes %}
    <li>
        <h3>{{ recipe.name }}</h3>
        <ul>
            <p>Author: {{recipe.author.name}}</p>
            <a href="{{recipe.get_absolute_url}}">Ingredients List</a>
        </ul>        
    </li>
    {% endfor %}
    <br>
    <a href="{% url 'ledger:recipe_add' %}">Add Recipe</a>
</ul>

{% endblock %}
